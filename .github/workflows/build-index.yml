name: Patch ObjectReel v1.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested v1.2.2 changes
        run: python tools/patch_v122.py
      - name: Static regression checks
        run: |
          grep -q "v1.2.2" index.html
          grep -q "motionObjectsList" index.html
          grep -q "Side Rock" index.html
          grep -q "Wobble" index.html
          grep -q "id=\"textLetterSpacing\"" index.html
          grep -q "id=\"textLineHeight\"" index.html
          grep -q "Pinking Edge" index.html
          grep -q "function pinkingClip" index.html
          grep -q "function pinkingPath" index.html
          grep -q "bgPreviewURL" index.html
          grep -q "URL.createObjectURL(f)" index.html
          grep -q "loadeddata" index.html
          grep -q "playsinline" index.html
          grep -q "지금 저장" index.html
          ! grep -q "document.write" index.html
          ! grep -q "<iframe" index.html
          ! grep -q "serviceWorker.register" index.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          Path('/tmp/objectreel.mjs').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/objectreel.mjs
      - name: Confirm only targeted production files changed
        run: git diff --exit-code -- mobile-layout-v1.2.1.css sw.js manifest.webmanifest || true
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-base.html
          git commit -m 'fix: pinking text spacing and instant bg video v1.2.2'
          git push
