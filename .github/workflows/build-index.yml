name: Patch ObjectReel v1.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline mobile layout only
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('mobile-layout-v1.2.1.css').read_text(encoding='utf-8')
          old_link = '<link rel="stylesheet" href="./mobile-layout-v1.2.1.css?v=1.2.1">'
          inline = '<style data-mobile-layout="v1.2.3">\n' + css + '\n</style>'

          for name in ('index.html','app-base.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'v1.2.2' not in s or "VERSION='1.2.2'" not in s:
                  raise SystemExit(f'v1.2.2 marker missing in {name}')
              if old_link not in s:
                  raise SystemExit(f'external mobile css marker missing in {name}')
              s=s.replace('v1.2.2','v1.2.3')
              s=s.replace("VERSION='1.2.2'","VERSION='1.2.3'")
              s=s.replace(old_link,inline,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Static regression checks
        run: |
          grep -q "v1.2.3" index.html
          grep -q "data-mobile-layout=\"v1.2.3\"" index.html
          grep -q "body.preview-compact .stage-shell" index.html
          grep -q "motionObjectsList" index.html
          grep -q "Pinking Edge" index.html
          grep -q "textLetterSpacing" index.html
          grep -q "textLineHeight" index.html
          grep -q "bgPreviewURL" index.html
          grep -q "URL.createObjectURL(f)" index.html
          ! grep -q "mobile-layout-v1.2.1.css?v=1.2.1" index.html
          ! grep -q "document.write" index.html
          ! grep -q "<iframe" index.html
          ! grep -q "serviceWorker.register" index.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)
          Path('/tmp/objectreel.mjs').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/objectreel.mjs
      - name: Commit verified layout fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-base.html
          git commit -m 'fix: inline mobile layout v1.2.3'
          git push
