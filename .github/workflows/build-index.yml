name: Rebuild ObjectReel v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild stable app
        run: python tools/rebuild_v120.py
      - name: Verify generated files
        run: |
          grep -q "v1.2.0" index.html
          grep -q "motionObjectsList" index.html
          grep -q "Pinking Edge" index.html
          grep -q "Side Rock" index.html
          grep -q "Wobble" index.html
          ! grep -q "document.write" index.html
          ! grep -q "<iframe" index.html
          ! grep -q "serviceWorker.register" index.html
      - name: Commit rebuilt app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-base.html index.html sw.js mobile-layout-v1.2.0.css
          git commit -m 'refactor: stable editor architecture v1.2.0'
          git push
