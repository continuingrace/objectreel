name: Build stable ObjectReel index

on:
  push:
    branches: [main]
    paths:
      - 'mobile-layout-v1.1.9.css'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate direct index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('app-base.html').read_text(encoding='utf-8')
          src = src.replace('v1.1.0', 'v1.1.9')
          src = src.replace("VERSION='1.1.0'", "VERSION='1.1.9'")
          if 'mobile-layout-v1.1.9.css' not in src:
              src = src.replace('</head>', '<link rel="stylesheet" href="./mobile-layout-v1.1.9.css?v=1.1.9"></head>')
          src = src.replace("if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});", '')
          Path('index.html').write_text(src, encoding='utf-8')
          PY
      - name: Commit generated index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix: direct stable mobile index v1.1.9'
            git push
          fi
