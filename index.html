<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f2">
<title>ObjectReel</title>
<style>html,body{margin:0;background:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#777;font-size:14px}</style>
</head>
<body>
<div class="boot">ObjectReel v1.1.8 준비 중…</div>
<script>
(async()=>{
  const target='./app-base.html?app=1.1.8';
  if(!('serviceWorker' in navigator)){location.replace(target);return;}
  let moved=false;
  const go=()=>{if(moved)return;moved=true;location.replace(target)};
  try{
    const reg=await navigator.serviceWorker.register('./sw.js?v=1.1.8',{updateViaCache:'none'});
    const worker=reg.installing||reg.waiting||reg.active;
    if(worker&&worker.state!=='activated'){
      worker.addEventListener('statechange',()=>{if(worker.state==='activated')setTimeout(go,80)});
      setTimeout(go,1800);
    }else{
      setTimeout(go,120);
    }
  }catch(e){go();}
})();
</script>
</body>
</html>
