<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f2">
<link rel="manifest" href="./manifest.webmanifest">
<title>ObjectReel</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;color:#777;font-size:14px;background:#f5f5f2;z-index:2}.app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f2;opacity:0;transition:opacity .18s ease}.app-frame.ready{opacity:1}.hide{display:none!important}
</style>
</head>
<body>
<div id="boot" class="boot">ObjectReel v1.1.6 불러오는 중…</div>
<iframe id="appFrame" class="app-frame" src="./app-base.html?v=1.1.6" title="ObjectReel"></iframe>
<script>
(()=>{
  const frame=document.getElementById('appFrame'),boot=document.getElementById('boot');
  function patchApp(){
    try{
      const w=frame.contentWindow,d=frame.contentDocument;
      if(!d||!d.head||!d.body)return;
      if(!d.querySelector('link[data-layout-fix]')){
        const link=d.createElement('link');
        link.rel='stylesheet';
        link.href='./layout-fix-v1.1.5.css?v=1.1.6';
        link.dataset.layoutFix='1';
        d.head.appendChild(link);
      }
      const version=d.querySelector('.version');
      if(version)version.textContent='v1.1.6';
      const panel=d.querySelector('.panel'),wrap=d.querySelector('.stage-wrap'),tabs=d.querySelector('.tabs');
      const placeTabs=()=>{
        if(!panel||!wrap||!tabs)return;
        if(w.innerWidth<=820){if(tabs.parentElement!==wrap)wrap.appendChild(tabs)}
        else if(tabs.parentElement!==panel)panel.insertBefore(tabs,panel.firstChild);
      };
      placeTabs();
      w.addEventListener('resize',placeTabs);
      frame.classList.add('ready');
      boot.classList.add('hide');
    }catch(e){
      boot.textContent='앱 화면을 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
    }
  }
  frame.addEventListener('load',()=>{patchApp();setTimeout(patchApp,120)});
  setTimeout(()=>{if(!frame.classList.contains('ready'))patchApp()},1200);
})();
</script>
</body>
</html>
