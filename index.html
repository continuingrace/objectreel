<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f2">
<link rel="manifest" href="manifest.webmanifest">
<title>ObjectReel</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#171717;--muted:#777773;--line:#deded8}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;background:rgba(245,245,242,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-weight:750;letter-spacing:-.03em}.version{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;max-width:1180px;margin:auto;padding:18px}.stage-wrap{display:flex;justify-content:center;align-items:flex-start}.stage-shell{width:min(100%,420px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.13);position:sticky;top:76px;background:#111}.stage{width:100%;height:100%;position:relative;overflow:hidden;background:#ddd;touch-action:none}.bg-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#777;font-size:13px;padding:24px}.object{position:absolute;width:45%;transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none}.object.selected{outline:1px solid rgba(255,255,255,.8);outline-offset:3px}.text-layer{position:absolute;left:10%;right:10%;bottom:12%;z-index:100;text-align:center;color:#fff;font-weight:700;line-height:1.18;text-shadow:0 2px 15px rgba(0,0,0,.25);white-space:pre-wrap;pointer-events:none}.panel{height:max-content;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}.tab{border:0;background:#f0f0ec;color:#666;border-radius:11px;padding:10px 4px;font-size:12px}.tab.active{background:#171717;color:#fff}.section{display:none}.section.active{display:block}.group{padding:12px 2px;border-top:1px solid #ecece7}.group:first-child{border-top:0;padding-top:2px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:#a23a3a}.file{display:none}.select,.text-input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.range{width:100%}.hint,.status{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}.status.busy{color:#222}.objects-list{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.thumb-wrap{position:relative;flex:0 0 58px}.thumb{width:58px;height:74px;border:1px solid var(--line);border-radius:10px;background:#f5f5f2;object-fit:contain;padding:3px}.badge{position:absolute;right:-3px;top:-4px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:9px}.bottom-mobile{display:none}@keyframes floaty{0%,100%{margin-top:0;transform:translate(-50%,-50%) rotate(var(--rot))}50%{margin-top:-12px;transform:translate(-50%,-50%) rotate(calc(var(--rot) + 1.5deg))}}@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(calc(var(--rot) - 3deg))}50%{transform:translate(-50%,-50%) rotate(calc(var(--rot) + 3deg))}}@keyframes zoom{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(var(--rot))}50%{transform:translate(-50%,-50%) scale(1.06) rotate(var(--rot))}}@keyframes drift{0%,100%{margin-left:-8px;margin-top:0}50%{margin-left:8px;margin-top:-7px}}@media(max-width:820px){.workspace{display:block;padding:12px 12px 92px}.stage-shell{position:relative;top:0;width:min(100%,390px);margin:auto}.panel{margin-top:14px}.tabs{position:sticky;top:58px;z-index:30;background:#fff;padding-top:2px}.bottom-mobile{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(245,245,242,.95);border-top:1px solid var(--line);z-index:60;backdrop-filter:blur(12px)}.bottom-mobile .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand">ObjectReel</div><div class="version">v1.0.1</div></header>
<main class="workspace">
  <div class="stage-wrap"><div class="stage-shell"><div id="stage" class="stage"><div id="emptyBg" class="empty">Background에<br>사진이나 영상을 추가하세요</div><div id="textLayer" class="text-layer"></div></div></div></div>
  <aside class="panel">
    <div class="tabs"><button class="tab active" data-tab="bg">BG</button><button class="tab" data-tab="obj">Objects</button><button class="tab" data-tab="motion">Motion</button><button class="tab" data-tab="text">Text</button><button class="tab" data-tab="export">Export</button></div>
    <section class="section active" id="sec-bg">
      <div class="group"><span class="label">Background · 사진 또는 영상</span><div class="row"><label class="btn primary" for="bgInput">파일 선택</label><input id="bgInput" class="file" type="file" accept="image/*,video/*"><button class="btn" id="clearBg">삭제</button></div><div id="bgStatus" class="status"></div></div>
      <div class="group"><span class="label">채우기 방식</span><select id="bgFit" class="select"><option value="cover">Cover</option><option value="contain">Fit</option></select></div>
    </section>
    <section class="section" id="sec-obj">
      <div class="group"><span class="label">Foreground Objects · 여러 장 선택 가능</span><div class="row"><label class="btn primary" for="objInput">사진 추가</label><input id="objInput" class="file" type="file" accept="image/*" multiple><button id="removeSelected" class="btn danger">선택 삭제</button></div><div class="hint">선택한 사진은 먼저 즉시 나타나고, 누끼는 그 뒤 자동 처리됩니다.</div><div id="removeStatus" class="status"></div></div>
      <div class="group"><div id="objectsList" class="objects-list"></div></div>
      <div class="group"><span class="label">크기</span><input id="objScale" class="range" type="range" min="20" max="180" value="100"><span class="label" style="margin-top:12px">회전</span><input id="objRotate" class="range" type="range" min="-180" max="180" value="0"></div>
    </section>
    <section class="section" id="sec-motion">
      <div class="group"><span class="label">선택 오브젝트 모션</span><select id="motionType" class="select"><option value="none">None</option><option value="float">Float</option><option value="sway">Sway</option><option value="zoom">Slow Zoom</option><option value="drift">Drift</option></select></div>
      <div class="group"><span class="label">속도</span><input id="motionSpeed" class="range" type="range" min="1" max="8" step="0.5" value="4"></div>
      <div class="group"><span class="label">여러 오브젝트 재생</span><select id="sequenceMode" class="select"><option value="together">동시에 보기</option><option value="sequence">순차 전환</option></select></div>
    </section>
    <section class="section" id="sec-text">
      <div class="group"><span class="label">텍스트</span><textarea id="textInput" class="text-input" rows="4" placeholder="텍스트를 입력하세요"></textarea></div>
      <div class="group"><span class="label">크기</span><input id="textSize" class="range" type="range" min="16" max="64" value="28"><span class="label" style="margin-top:12px">위치</span><input id="textY" class="range" type="range" min="5" max="90" value="76"></div>
    </section>
    <section class="section" id="sec-export">
      <div class="group"><span class="label">영상 길이</span><select id="duration" class="select"><option value="6">6초</option><option value="10" selected>10초</option><option value="15">15초</option><option value="20">20초</option></select></div>
      <div class="group"><button id="exportBtn" class="btn primary" style="width:100%">영상 만들기</button><div id="exportStatus" class="status">브라우저가 지원하는 영상 형식으로 저장합니다.</div></div>
      <div class="group"><button id="resetAll" class="btn danger" style="width:100%">프로젝트 초기화</button></div>
    </section>
  </aside>
</main>
<div class="bottom-mobile"><button class="btn primary" id="mobileExport">영상 만들기</button></div>
<script type="module">
const VERSION='1.0.1';
const $=id=>document.getElementById(id),stage=$('stage'),textLayer=$('textLayer');
const state={bg:null,bgKind:null,bgFit:'cover',objects:[],selected:null,text:'',textSize:28,textY:76,sequenceMode:'together',duration:10};
let bgEl=null,drag=null,saveTimer=null,db=null;
function uid(){return Math.random().toString(36).slice(2)}
function dataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function openDB(){return new Promise((res,rej)=>{const req=indexedDB.open('ObjectReelDB',1);req.onupgradeneeded=()=>req.result.createObjectStore('project');req.onsuccess=()=>{db=req.result;res(db)};req.onerror=()=>rej(req.error)})}
async function saveState(){try{if(!db)await openDB();const tx=db.transaction('project','readwrite');tx.objectStore('project').put(structuredClone(state),'current')}catch(e){console.warn('autosave',e)}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,250)}
async function restore(){try{if(!db)await openDB();const tx=db.transaction('project','readonly');const req=tx.objectStore('project').get('current');const saved=await new Promise(r=>{req.onsuccess=()=>r(req.result);req.onerror=()=>r(null)});if(saved)Object.assign(state,saved)}catch(e){console.warn('restore',e)}}
function selectTab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+name))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
function renderBg(){if(bgEl)bgEl.remove();bgEl=null;$('emptyBg').style.display=state.bg?'none':'grid';if(!state.bg)return;if(state.bgKind==='video'){bgEl=document.createElement('video');bgEl.src=state.bg;bgEl.muted=true;bgEl.loop=true;bgEl.playsInline=true;bgEl.autoplay=true;bgEl.play().catch(()=>{})}else{bgEl=document.createElement('img');bgEl.src=state.bg}bgEl.className='bg-media';bgEl.style.objectFit=state.bgFit;stage.prepend(bgEl)}
function applyTransform(o,el){el.style.left=(o.x??50)+'%';el.style.top=(o.y??50)+'%';el.style.width=(45*(o.scale||1))+'%';el.style.setProperty('--rot',(o.rotate||0)+'deg');el.style.transform=`translate(-50%,-50%) rotate(${o.rotate||0}deg)`;const m=o.motion||'none';el.style.animation=m==='none'?'none':`${m==='float'?'floaty':m==='sway'?'sway':m==='zoom'?'zoom':'drift'} ${o.speed||4}s ease-in-out infinite`}
function renderObjects(){stage.querySelectorAll('.object').forEach(e=>e.remove());const list=$('objectsList');list.innerHTML='';state.objects.forEach((o,i)=>{const img=document.createElement('img');img.src=o.src;img.className='object'+(o.id===state.selected?' selected':'');img.dataset.id=o.id;img.style.zIndex=10+i;applyTransform(o,img);img.addEventListener('pointerdown',startDrag);stage.appendChild(img);const wrap=document.createElement('div');wrap.className='thumb-wrap';const th=document.createElement('img');th.src=o.src;th.className='thumb';th.onclick=()=>{state.selected=o.id;renderObjects();syncControls()};wrap.appendChild(th);if(o.processing){const badge=document.createElement('span');badge.className='badge';badge.textContent='…';wrap.appendChild(badge)}list.appendChild(wrap)});syncControls()}
function syncControls(){const o=state.objects.find(x=>x.id===state.selected);$('objScale').value=o?Math.round((o.scale||1)*100):100;$('objRotate').value=o?(o.rotate||0):0;$('motionType').value=o?(o.motion||'none'):'none';$('motionSpeed').value=o?(o.speed||4):4;$('sequenceMode').value=state.sequenceMode;$('textInput').value=state.text||'';$('textSize').value=state.textSize;$('textY').value=state.textY;$('duration').value=state.duration;renderText()}
function renderText(){textLayer.textContent=state.text||'';textLayer.style.fontSize=state.textSize+'px';textLayer.style.bottom=(100-state.textY)+'%'}
function startDrag(e){e.preventDefault();const el=e.currentTarget,id=el.dataset.id,o=state.objects.find(x=>x.id===id);state.selected=id;drag={id,startX:e.clientX,startY:e.clientY,x:o.x??50,y:o.y??50};try{el.setPointerCapture(e.pointerId)}catch{}el.onpointermove=moveDrag;el.onpointerup=endDrag;el.onpointercancel=endDrag;stage.querySelectorAll('.object').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));syncControls()}
function moveDrag(e){if(!drag)return;const r=stage.getBoundingClientRect(),o=state.objects.find(x=>x.id===drag.id);o.x=Math.max(0,Math.min(100,drag.x+(e.clientX-drag.startX)/r.width*100));o.y=Math.max(0,Math.min(100,drag.y+(e.clientY-drag.startY)/r.height*100));applyTransform(o,e.currentTarget);scheduleSave()}
function endDrag(e){drag=null;e.currentTarget.onpointermove=null;e.currentTarget.onpointerup=null;e.currentTarget.onpointercancel=null;scheduleSave()}
$('bgInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;$('bgStatus').textContent='불러오는 중…';try{state.bg=await dataURL(f);state.bgKind=f.type.startsWith('video/')?'video':'image';renderBg();scheduleSave();$('bgStatus').textContent='추가 완료'}catch{$('bgStatus').textContent='파일을 불러오지 못했습니다.'}e.target.value=''};
$('clearBg').onclick=()=>{state.bg=null;state.bgKind=null;renderBg();scheduleSave()};$('bgFit').onchange=e=>{state.bgFit=e.target.value;if(bgEl)bgEl.style.objectFit=state.bgFit;scheduleSave()};
let removerModule=null;async function removeBackgroundLater(file,id){const status=$('removeStatus');status.className='status busy';status.textContent='누끼 처리 중… 화면 편집은 계속할 수 있습니다.';try{if(!removerModule)removerModule=await import('https://esm.sh/@imgly/background-removal@1.7.0');const blob=await removerModule.removeBackground(file,{output:{format:'image/png',quality:1}});const cut=await dataURL(new File([blob],'cutout.png',{type:'image/png'}));const o=state.objects.find(x=>x.id===id);if(o){o.src=cut;o.processing=false;renderObjects();scheduleSave()}status.textContent='누끼 처리 완료'}catch(err){console.warn(err);const o=state.objects.find(x=>x.id===id);if(o)o.processing=false;renderObjects();status.textContent='이 기기에서는 자동 누끼가 실패했습니다. 원본 사진은 그대로 사용할 수 있습니다.'}finally{status.className='status'}}
$('objInput').onchange=async e=>{const files=[...(e.target.files||[])];if(!files.length)return;for(const f of files){const src=await dataURL(f);const o={id:uid(),src,x:50+Math.random()*8-4,y:50+Math.random()*8-4,scale:1,rotate:0,motion:'float',speed:4,processing:true};state.objects.push(o);state.selected=o.id;renderObjects();scheduleSave();setTimeout(()=>removeBackgroundLater(f,o.id),30)}e.target.value=''};
$('removeSelected').onclick=()=>{state.objects=state.objects.filter(o=>o.id!==state.selected);state.selected=state.objects.at(-1)?.id||null;renderObjects();scheduleSave()};
$('objScale').oninput=e=>{const o=state.objects.find(x=>x.id===state.selected);if(o){o.scale=+e.target.value/100;const el=stage.querySelector(`.object[data-id="${o.id}"]`);if(el)applyTransform(o,el);scheduleSave()}};$('objRotate').oninput=e=>{const o=state.objects.find(x=>x.id===state.selected);if(o){o.rotate=+e.target.value;const el=stage.querySelector(`.object[data-id="${o.id}"]`);if(el)applyTransform(o,el);scheduleSave()}};
$('motionType').onchange=e=>{const o=state.objects.find(x=>x.id===state.selected);if(o){o.motion=e.target.value;renderObjects();scheduleSave()}};$('motionSpeed').oninput=e=>{const o=state.objects.find(x=>x.id===state.selected);if(o){o.speed=+e.target.value;renderObjects();scheduleSave()}};$('sequenceMode').onchange=e=>{state.sequenceMode=e.target.value;scheduleSave()};
$('textInput').oninput=e=>{state.text=e.target.value;renderText();scheduleSave()};$('textSize').oninput=e=>{state.textSize=+e.target.value;renderText();scheduleSave()};$('textY').oninput=e=>{state.textY=+e.target.value;renderText();scheduleSave()};$('duration').onchange=e=>{state.duration=+e.target.value;scheduleSave()};
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function drawFit(ctx,m,w,h,fit='cover'){const mw=m.videoWidth||m.naturalWidth||w,mh=m.videoHeight||m.naturalHeight||h,s=fit==='contain'?Math.min(w/mw,h/mh):Math.max(w/mw,h/mh),dw=mw*s,dh=mh*s;ctx.drawImage(m,(w-dw)/2,(h-dh)/2,dw,dh)}
function wave(t,s){return Math.sin(t*Math.PI*2/s)}
async function exportVideo(){const status=$('exportStatus'),btn=$('exportBtn');btn.disabled=true;status.textContent='영상 준비 중…';try{if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder)throw new Error('unsupported');const W=1080,H=1920,fps=30,dur=state.duration,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d'),imgs={};for(const o of state.objects)imgs[o.id]=await loadImage(o.src);let bgi=null,bgv=null;if(state.bg){if(state.bgKind==='video'){bgv=document.createElement('video');bgv.src=state.bg;bgv.muted=true;bgv.playsInline=true;await new Promise((res,rej)=>{bgv.onloadeddata=res;bgv.onerror=rej});await bgv.play()}else bgi=await loadImage(state.bg)}const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw new Error('codec');const stream=canvas.captureStream(fps),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);rec.start(100);const start=performance.now();await new Promise(resolve=>{function frame(now){const t=(now-start)/1000;ctx.clearRect(0,0,W,H);ctx.fillStyle='#ddd';ctx.fillRect(0,0,W,H);if(bgv)drawFit(ctx,bgv,W,H,state.bgFit);else if(bgi)drawFit(ctx,bgi,W,H,state.bgFit);state.objects.forEach((o,idx)=>{if(state.sequenceMode==='sequence'&&state.objects.length>1){const slot=dur/state.objects.length;if(Math.min(state.objects.length-1,Math.floor(t/slot))!==idx)return}const im=imgs[o.id],bw=W*.45*(o.scale||1),bh=bw*(im.naturalHeight/im.naturalWidth);let x=(o.x??50)/100*W,y=(o.y??50)/100*H,r=(o.rotate||0)*Math.PI/180,sc=1,w=wave(t,o.speed||4);if(o.motion==='float')y-=18*w;if(o.motion==='sway')r+=.05*w;if(o.motion==='zoom')sc+=.03*(w+1);if(o.motion==='drift'){x+=16*w;y-=9*Math.cos(t*Math.PI*2/(o.speed||4))}ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(sc,sc);ctx.drawImage(im,-bw/2,-bh/2,bw,bh);ctx.restore()});if(state.text){ctx.save();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`700 ${state.textSize*2.8}px Pretendard, sans-serif`;ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=18;state.text.split('\n').forEach((line,i)=>ctx.fillText(line,W/2,state.textY/100*H+i*state.textSize*3.1));ctx.restore()}if(t<dur)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});rec.stop();if(bgv)bgv.pause();await done;const blob=new Blob(chunks,{type:mime}),ext=mime.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ObjectReel-v${VERSION}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent=`저장 완료 (${ext.toUpperCase()})`}catch(err){console.warn(err);status.textContent='현재 iPhone/Safari에서는 이 방식의 영상 저장이 지원되지 않을 수 있습니다. 다음 업데이트에서 iOS 전용 렌더러를 적용하겠습니다.'}finally{btn.disabled=false}}
$('exportBtn').onclick=exportVideo;$('mobileExport').onclick=()=>{selectTab('export');setTimeout(exportVideo,50)};$('resetAll').onclick=async()=>{if(confirm('현재 프로젝트를 초기화할까요?')){try{if(!db)await openDB();db.transaction('project','readwrite').objectStore('project').delete('current')}catch{}location.reload()}};
await restore();$('bgFit').value=state.bgFit||'cover';renderBg();renderObjects();renderText();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
