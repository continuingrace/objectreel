:root{--bg:#f5f5f2;--panel:#fff;--ink:#171717;--muted:#777773;--line:#deded8}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.top{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:70;background:rgba(245,245,242,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-weight:750}.version{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;max-width:1180px;margin:auto;padding:18px}.stage-wrap{display:flex;justify-content:center;align-items:flex-start}.stage-shell{width:min(100%,420px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 18px 45px rgba(0,0,0,.13);position:sticky;top:76px;background:#111;z-index:20;transition:width .22s ease,border-radius .22s ease,box-shadow .22s ease}.stage{width:100%;height:100%;position:relative;overflow:hidden;background:#ddd;touch-action:none}.bg-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bg-filter{position:absolute;inset:0;z-index:5;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#777;font-size:13px;padding:24px}.object{position:absolute;width:45%;transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none}.object.selected{outline:1px solid rgba(255,255,255,.82);outline-offset:3px}.text-layer{position:absolute;left:10%;right:10%;bottom:12%;z-index:100;text-align:center;font-weight:700;line-height:1.18;text-shadow:0 2px 15px rgba(0,0,0,.25);white-space:pre-wrap;pointer-events:none}.panel{height:max-content;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}.tab{border:0;background:#f0f0ec;color:#666;border-radius:11px;padding:10px 4px;font-size:12px}.tab.active{background:#171717;color:#fff}.section{display:none}.section.active{display:block}.group{padding:16px 4px;border-top:1px solid #ecece7}.group:first-child{border-top:0;padding-top:10px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:9px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;cursor:pointer;min-height:44px}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.danger{color:#a23a3a}.btn:disabled{opacity:.45}.file{display:none}.select,.text-input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;min-height:44px}.range{width:100%}.hint,.status{font-size:11px;color:var(--muted);line-height:1.55;margin-top:9px}.objects-list{display:flex;gap:8px;overflow:auto;padding:4px 1px 6px}.thumb-wrap{position:relative;flex:0 0 58px}.thumb{width:58px;height:74px;border:1px solid var(--line);border-radius:10px;background:#f5f5f2;object-fit:contain;padding:3px}.thumb-wrap.selected .thumb{border-color:#171717;box-shadow:0 0 0 1px #171717}.badge{position:absolute;right:-3px;top:-4px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:9px}.value{font-size:11px;color:var(--muted);min-width:52px;text-align:right}.control-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.color-row{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}.color-input{width:52px;height:44px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#fff}.bottom-mobile{display:none}@keyframes floaty{0%,100%{margin-top:0;transform:translate(-50%,-50%) rotate(var(--rot))}50%{margin-top:-12px;transform:translate(-50%,-50%) rotate(calc(var(--rot) + 1.5deg))}}@keyfra </style></head><body><header class="top"><div class="brand">ObjectReel</div><div class="version">v1.0.4</div></header><main class="workspace"><div class="stage-wrap"><div class="stage-shell"><div id="stage" class="stage"><div id="emptyBg" class="empty">Background에<br>사진이나 영상을 추가하세요</div><div id="bgFilter" class="bg-filter"></div><div id="textLayer" class="text-layer"></div></div></div></div><aside class="panel"><div class="tabs"><button class="tab active" data-tab="bg">BG</button><button class="tab" data-tab="obj">Objects</button><button class="tab" data-tab="motion">Motion</button><button class="tab" data-tab="text">Text</button><button class="tab" data-tab="export">Export</button></div>
<section class="section active" id="sec-bg"><div class="group"><span class="label">Background · 사진 또는 영상</span><div class="row"><label class="btn primary" for="bgInput">파일 선택</label><input id="bgInput" class="file" type="file" accept="image/*,video/*"><button class="btn" id="clearBg">삭제</button></div><div id="bgStatus" class="status"></div></div><div class="group"><span class="label">채우기 방식</span><select id="bgFit" class="select"><option value="cover">Cover</option><option value="contain">Fit</option></select></div><div class="group"><span class="label">배경 색상 필터</span><div class="color-row"><input id="bgFilterColor" class="color-input" type="color" value="#000000"><input id="bgFilterOpacity" class="range" type="range" min="0" max="100" value="0"></div><div id="bgFilterValue" class="status">투명도 0%</div></div></section>
<section class="section" id="sec-obj"><div class="group"><span class="label">Foreground Objects</span><div class="row"><label class="btn primary" for="objInput">사진 추가</label><input id="objInput" class="file" type="file" accept="image/*" multiple><button id="cutoutSelected" class="btn">선택 누끼 따기</button><button id="removeSelected" class="btn danger">선택 삭제</button></div><div id="removeStatus" class="status"></div></div><div class="group"><div id="objectsList" class="objects-list"></div></div><div class="group"><span class="label">X 위치</span><div class="control-row"><input id="objX" class="range" type="range" min="0" max="100" value="50"><span id="objXVal" class="value">50</span></div><span class="label" style="margin-top:14px">Y 위치</span><div class="control-row"><input id="objY" class="range" type="range" min="0" max="100" value="50"><span id="objYVal" class="value">50</span></div></div><div class="group"><span class="label">크기</span><input id="objScale" class="range" type="range" min="20" max="180" value="100"><span class="label" style="margin-top:14px">회전</span><div class="control-row"><input id="objRotate" class="range" type="range" min="-180" max="180" value="0"><span id="objRotateVal" class="value">0°</span></div><div class="row" style="margin-top:10px"><button id="rotLeft" class="btn">↶ 90°</button><button id="rotRight" class="btn">↷ 90°</button></div></div></section>
<section class="section" id="sec-motion"><div class="group"><span class="label">선택 오브젝트 모션</span><select id="motionType" class="select"><option value="none">None</option><option value="float">Float</option><option value="sway">Sway</option><option value="zoom">Slow Zoom</option><option value="drift">Drift</option><option value="thunk">뚱땅 좌우 흔들림</option></select></div><div class="group"><span class="label">모션 속도</span><input id="motionSpeed" class="range" type="range" min="0.8" max="8" step="0.2" value="4"></div><div class="group"><span class="label">여러 오브젝트 재생</span><select id="sequenceMode" class="select"><option value="together">동시에 보기</option><option value="sequence">순차 전환</option></select></div><div class="group"><span class="label">전환 효과</span><select id="transitionEffect" class="select"><option value="cut">바로 전환</option><option value="dissolve">디졸브</option><option value="fade">페이드 인·아웃</option></select></div><div class="group"><span class="label">전환 시간</span><input id="transitionDuration" class="range" type="range" min="0.2" max="1.5" step="0.1" value="0.6"><div id="transitionValue" class="status">0.6초</div></div></section>
<section class="section" id="sec-text"><div class="group"><span class="label">텍스트</span><textarea id="textInput" class="text-input" rows="4"></textarea></div><div class="group"><span class="label">서체</span><select id="fontFamily" class="select"><option value="Pretendard, sans-serif">Pretendard</option><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="'Times New Roman', serif">Times New Roman</option><option value="'Courier New', monospace">Courier New</option><option value="system-ui, sans-serif">System</option><option value="cursive">Cursive</option><option value="fantasy">Display</option></select></div><div class="group"><span class="label">서체 컬러</span><input id="textColor" class="color-input" type="color" value="#ffffff"></div><div class="group"><span class="label">크기</span><input id="textSize" class="range" type="range" min="16" max="64" value="28"><span class="label" style="margin-top:14px">위치</span><input id="textY" class="range" type="range" min="5" max="90" value="76"></div></section>
<section class="section" id="sec-export"><div class="group"><span class="label">영상 길이</span><select id="duration" class="select"><option value="6">6초</option><option value="10" selected>10초</option><option value="15">15초</option><option value="20">20초</option></select></div><div class="group"><button id="exportBtn" class="btn primary" style="width:100%">영상 만들기</button><div id="exportStatus" class="status">브라우저가 지원하는 영상 형식으로 저장합니다.</div></div><div class="group"><button id="resetAll" class="btn danger" style="width:100%">프로젝트 초기화</button></div></section></aside></main><div class="bottom-mobile"><button class="btn primary" id="mobileExport">영상 만들기</button></div>
<script type="module">
const VERSION='1.0.4', $=id=>document.getElementById(id), stage=$('stage'), textLayer=$('textLayer');const state={bg:null,bgKind:null,bgFit:'cover',bgFilterColor:'#000000',bgFilterOpacity:0,objects:[],selected:null,text:'',textSize:28,textY:76,textColor:'#ffffff',fontFamily:'Pretendard, sans-serif',sequenceMode:'together',transitionEffect:'cut',transitionDuration:.6,duration:10};let bgEl=null,drag=null,saveTimer=null,db=null,removerModule=null,previewStart=performance.now();
function uid(){return Math.random().toString(36).slice(2)}function dataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}async function dataURLToFile(src){const b=await(await fetch(src)).blob();return new File([b],'object.jpg',{type:b.type||'image/jpeg'})}function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ObjectReelDB',1);q.onupgradeneeded=()=>q.result.createObjectStore('project');q.onsuccess=()=>{db=q.result;res(db)};q.onerror=()=>rej(q.error)})}async function saveState(){try{if(!db)await openDB();db.transaction('project','readwrite').objectStore('project').put(structuredClone(state),'current')}catch{}}function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,250)}async function restore(){try{if(!db)await openDB();const q=db.transaction('project','readonly').objectStore('project').get('current');const s=await new Promise(r=>{q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(s)Object.assign(state,s);state.objects=(state.objects||[]).map(o=>({...o,processing:false}))}catch{}}
function selectTab(n){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+n))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));function renderBg(){if(bgEl)bgEl.remove();bgEl=null;$('emptyBg').style.display=state.bg?'none':'grid';if(state.bg){bgEl=document.createElement(state.bgKind==='video'?'video':'img');bgEl.src=state.bg;if(state.bgKind==='video'){bgEl.muted=true;bgEl.loop=true;bgEl.playsInline=true;bgEl.autoplay=true;bgEl.play().catch(()=>{})}bgEl.className='bg-media';bgEl.style.objectFit=state.bgFit;stage.prepend(bgEl)}renderBgFilter()}function renderBgFilter(){$('bgFilter').style.background=state.bgFilterColor;$('bgFilter').style.opacity=(state.bgFilterOpacity||0)/100;$('bgFilterValue').textContent='투명도 '+(state.bgFilterOpacity||0)+'%'}
function applyTransform(o,el){el.style.left=(o.x??50)+'%';el.style.top=(o.y??50)+'%';el.style.width=(45*(o.scale||1))+'%';el.style.setProperty('--rot',(o.rotate||0)+'deg');el.style.transform=`translate(-50%,-50%) rotate(${o.rotate||0}deg)`;const m=o.motion||'none',a=m==='float'?'floaty':m==='sway'?'sway':m==='zoom'?'zoom':m==='drift'?'drift':m==='thunk'?'thunk':null;el.style.animation=a?`${a} ${o.speed||4}s ease-in-out infinite`:'none'}function renderObjects(){stage.querySelectorAll('.object').forEach(e=>e.remove());const list=$('objectsList');list.innerHTML='';state.objects.forEach((o,i)=>{const img=document.createElement('img');img.src=o.src;img.className='object'+(o.id===state.selected?' selected':'');img.dataset.id=o.id;img.style.zIndex=10+i;applyTransform(o,img);img.onpointerdown=startDrag;stage.appendChild(img);const w=document.createElement('div');w.className='thumb-wrap'+(o.id===state.selected?' selected':'');const th=document.createElement('img');th.src=o.src;th.className='thumb';th.onclick=()=>{state.selected=o.id;renderObjects()};w.appendChild(th);if(o.cutout||o.processing){const b=document.createElement('span');b.className='badge';b.textContent=o.processing?'…':'✓';w.appendChild(b)}list.appendChild(w)});sync();previewStart=performance.now()}function sync(){const o=state.objects.find(x=>x.id===state.selected);$('objX').value=o?o.x??50:50;$('objY').value=o?o.y??50:50;$('objXVal').textContent=Math.round(o?o.x??50:50);$('objYVal').textContent=Math.round(o?o.y??50:50);$('objScale').value=o?Math.round((o.scale||1)*100):100;$('objRotate').value=o?o.rotate||0:0;$('objRotateVal').textContent=(o?o.rotate||0:0)+'°';$('motionType').value=o?o.motion||'none':'none';$('motionSpeed').value=o?o.speed||4:4;$('sequenceMode').value=state.sequenceMode;$('transitionEffect').value=state.transitionEffect;$('transitionDuration').value=state.transitionDuration;$('transitionValue').textContent=Number(state.transitionDuration).toFixed(1)+'초';$('cutoutSelected').disabled=!o||o.processing;$('textInput').value=state.text||'';$('textSize').value=state.textSize;$('textY').value=state.textY;$('textColor').value=state.textColor;$('fontFamily').value=state.fontFamily;$('duration').value=state.duration;$('bgFilterColor').value=state.bgFilterColor;$('bgFilterOpacity').value=state.bgFilterOpacity;renderText();renderBgFilter()}function renderText(){textLayer.textContent=state.text||'';textLayer.style.fontSize=state.textSize+'px';textLayer.style.bottom=(100-state.textY)+'%';textLayer.style.color=state.textColor;textLayer.style.fontFamily=state.fontFamily}
function startDrag(e){e.preventDefault();const el=e.currentTarget,o=state.objects.find(x=>x.id===el.dataset.id);state.selected=o.id;drag={id:o.id,startX:e.clientX,startY:e.clientY,x:o.x??50,y:o.y??50};try{el.setPointerCapture(e.pointerId)}catch{}el.onpointermove=moveDrag;el.onpointerup=endDrag;sync()}function moveDrag(e){if(!drag)return;const r=stage.getBoundingClientRect(),o=state.objects.find(x=>x.id===drag.id);o.x=Math.max(0,Math.min(100,drag.x+(e.clientX-drag.startX)/r.width*100));o.y=Math.max(0,Math.min(100,drag.y+(e.clientY-drag.startY)/r.height*100));applyTransform(o,e.currentTarget);sync();scheduleSave()}function endDrag(e){drag=null;e.currentTarget.onpointermove=null;e.currentTarget.onpointerup=null;scheduleSave()}
$('bgInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;state.bg=await dataURL(f);state.bgKind=f.type.startsWith('video/')?'video':'image';renderBg();scheduleSave();e.target.value=''};$('clearBg').onclick=()=>{state.bg=null;state.bgKind=null;renderBg();scheduleSave()};$('bgFit').onchange=e=>{state.bgFit=e.target.value;if(bgEl)bgEl.style.objectFit=state.bgFit;scheduleSave()};$('bgFilterColor').oninput=e=>{state.bgFilterColor=e.target.value;renderBgFilter();scheduleSave()};$('bgFilterOpacity').oninput=e=>{state.bgFilterOpacity=+e.target.value;renderBgFilter();scheduleSave()};$('objInput').onchange=async e=>{for(const f of [...(e.target.files||[])]){const src=await dataURL(f);const o={id:uid(),src,originalSrc:src,x:50,y:50,scale:1,rotate:0,motion:'float',speed:4,processing:false,cutout:false};state.objects.push(o);state.selected=o.id;renderObjects();scheduleSave()}e.target.value=''};$('cutoutSelected').onclick=async()=>{const o=state.objects.find(x=>x.id===state.selected);if(!o||o.processing)return;o.processing=true;renderObjects();$('removeStatus').textContent='선택한 오브젝트 누끼 처리 중…';try{if(!removerModule)removerModule=await import('https://esm.sh/@imgly/background-removal@1.7.0');const blob=await removerModule.removeBackground(await dataURLToFile(o.originalSrc||o.src),{output:{format:'image/png',quality:1}});o.src=await dataURL(new File([blob],'cutout.png',{type:'image/png'}));o.cutout=true;$('removeStatus').textContent='누끼 완료'}catch{$('removeStatus').textContent='누끼 처리 실패'}finally{o.processing=false;renderObjects();scheduleSave()}};$('removeSelected').onclick=()=>{state.objects=state.objects.filter(o=>o.id!==state.selected);state.selected=state.objects.at(-1)?.id||null;renderObjects();scheduleSave()};function updateSel(p,v){const o=state.objects.find(x=>x.id===state.selected);if(!o)return;o[p]=v;const el=stage.querySelector(`.object[data-id="${o.id}"]`);if(el)applyTransform(o,el);sync();scheduleSave()}$('objX').oninput=e=>updateSel('x',+e.target.value);$('objY').oninput=e=>updateSel('y',+e.target.value);$('objScale').oninput=e=>updateSel('scale',+e.target.value/100);$('objRotate').oninput=e=>updateSel('rotate',+e.target.value);$('rotLeft').onclick=()=>{const o=state.objects.find(x=>x.id===state.selected);if(o)updateSel('rotate',Math.max(-180,Math.min(180,(o.rotate||0)-90)))};$('rotRight').onclick=()=>{const o=state.objects.find(x=>x.id===state.selected);if(o)updateSel('rotate',Math.max(-180,Math.min(180,(o.rotate||0)+90)))};$('motionType').onchange=e=>updateSel('motion',e.target.value);$('motionSpeed').oninput=e=>updateSel('speed',+e.target.value);$('sequenceMode').onchange=e=>{state.sequenceMode=e.target.value;previewStart=performance.now();scheduleSave()};$('transitionEffect').onchange=e=>{state.transitionEffect=e.target.value;previewStart=performance.now();scheduleSave()};$('transitionDuration').oninput=e=>{state.transitionDuration=+e.target.value;sync();previewStart=performance.now();scheduleSave()};$('textInput').oninput=e=>{state.text=e.target.value;renderText();scheduleSave()};$('textSize').oninput=e=>{state.textSize=+e.target.value;renderText();scheduleSave()};$('textY').oninput=e=>{state.textY=+e.target.value;renderText();scheduleSave()};$('textColor').oninput=e=>{state.textColor=e.target.value;renderText();scheduleSave()};$('fontFamily').onchange=e=>{state.fontFamily=e.target.value;renderText();scheduleSave()};$('duration').onchange=e=>{state.duration=+e.target.value;previewStart=performance.now();scheduleSave()};
function op(idx,t,dur){if(state.sequenceMode!=='sequence'||state.objects.length<=1)return 1;const n=state.objects.length,slot=dur/n,start=idx*slot,end=(idx+1)*slot,tr=Math.min(state.transitionDuration||.6,slot*.45),fx=state.transitionEffect||'cut';if(fx==='cut')return t>=start&&t<end?1:0;if(fx==='fade'){if(t<start||t>=end)return 0;if(t<start+tr)return(t-start)/tr;if(t>end-tr)return(end-t)/tr;return 1}if(t<start-tr||t>end+tr)return 0;if(t<start)return(t-(start-tr))/tr;if(t>end)return 1-(t-end)/tr;return 1}function preview(now){const dur=state.duration||10,t=((now-previewStart)/1000)%dur;state.objects.forEach((o,i)=>{const el=stage.querySelector(`.object[data-id="${o.id}"]`);if(el)el.style.opacity=Math.max(0,Math.min(1,op(i,t,dur)))});requestAnimationFrame(preview)}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}function drawFit(ctx,m,w,h,fit='cover'){const mw=m.videoWidth||m.naturalWidth||w,mh=m.videoHeight||m.naturalHeight||h,s=fit==='contain'?Math.min(w/mw,h/mh):Math.max(w/mw,h/mh),dw=mw*s,dh=mh*s;ctx.drawImage(m,(w-dw)/2,(h-dh)/2,dw,dh)}function wave(t,s){return Math.sin(t*Math.PI*2/s)}function rgb(h){const x=h.replace('#','');return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]}async function exportVideo(){const status=$('exportStatus'),btn=$('exportBtn');btn.disabled=true;status.textContent='영상 준비 중…';try{if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder)throw 0;const W=1080,H=1920,dur=state.duration,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d'),imgs={};for(const o of state.objects)imgs[o.id]=await loadImage(o.src);let bgi=null,bgv=null;if(state.bg){if(state.bgKind==='video'){bgv=document.createElement('video');bgv.src=state.bg;bgv.muted=true;bgv.playsInline=true;await new Promise((r,j)=>{bgv.onloadeddata=r;bgv.onerror=j});await bgv.play()}else bgi=await loadImage(state.bg)}const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw 0;const rec=new MediaRecorder(canvas.captureStream(30),{mimeType:mime,videoBitsPerSecond:1e7}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const done=new Promise(r=>rec.onstop=r);rec.start(100);const started=performance.now();await new Promise(resolve=>{function frame(now){const t=(now-started)/1000;ctx.clearRect(0,0,W,H);ctx.fillStyle='#ddd';ctx.fillRect(0,0,W,H);if(bgv)drawFit(ctx,bgv,W,H,state.bgFit);else if(bgi)drawFit(ctx,bgi,W,H,state.bgFit);if(state.bgFilterOpacity>0){const [r,g,b]=rgb(state.bgFilterColor);ctx.fillStyle=`rgba(${r},${g},${b},${state.bgFilterOpacity/100})`;ctx.fillRect(0,0,W,H)}state.objects.forEach((o,i)=>{const a=op(i,Math.min(t,dur-.001),dur);if(a<=0)return;const im=imgs[o.id],bw=W*.45*(o.scale||1),bh=bw*(im.naturalHeight/im.naturalWidth);let x=(o.x??50)/100*W,y=(o.y??50)/100*H,r=(o.rotate||0)*Math.PI/180,sc=1,wv=wave(t,o.speed||4);if(o.motion==='float')y-=18*wv;if(o.motion==='sway')r+=.05*wv;if(o.motion==='zoom')sc+=.03*(wv+1);if(o.motion==='drift'){x+=16*wv;y-=9*Math.cos(t*Math.PI*2/(o.speed||4))}if(o.motion==='thunk'){x+=20*Math.sin(t*Math.PI*4/(o.speed||2));r+=.07*Math.sin(t*Math.PI*4/(o.speed||2))}ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(r);ctx.scale(sc,sc);ctx.drawImage(im,-bw/2,-bh/2,bw,bh);ctx.restore()});if(state.text){ctx.save();ctx.fillStyle=state.textColor;ctx.textAlign='center';ctx.font=`700 ${state.textSize*2.8}px ${state.fontFamily}`;state.text.split('\n').forEach((line,i)=>ctx.fillText(line,W/2,state.textY/100*H+i*state.textSize*3.1));ctx.restore()}if(t<dur)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});rec.stop();if(bgv)bgv.pause();await done;const blob=new Blob(chunks,{type:mime}),ext=mime.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ObjectReel-v${VERSION}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='저장 완료'}catch{status.textContent='현재 기기에서는 영상 저장이 지원되지 않을 수 있습니다.'}finally{btn.disabled=false}}$('exportBtn').onclick=exportVideo;$('mobileExport').onclick=()=>{selectTab('export');setTimeout(exportVideo,50)};$('resetAll').onclick=async()=>{if(confirm('현재 프로젝트를 초기화할까요?')){try{if(!db)await openDB();db.transaction('project','readwrite').objectStore('project').delete('current')}catch{}location.reload()}};
